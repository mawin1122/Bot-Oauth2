<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Discord</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #313A37;
            color: #FFFFFF; /* ใส่สีตัวอักษรเป็นขาวหรือสีที่เหมาะสมกับสีพื้นหลัง */
            font-family: Arial, sans-serif; /* เลือกแบบอักษรที่ต้องการ */
            padding: 20px; /* ใส่พื้นที่ขอบเพจ */
        }
        .center-container {
            text-align: center;
        }
        .login-button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            text-decoration: none;
            color: #fff;
            background-color: #7289da;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .login-button:hover {
            background-color: #5b6eae;
        }
    </style>
</head>
<body>
    <div class="center-container">
        <a href="/login" class="login-button">Login with Discord</a>
    </div>
</body>
</html>
